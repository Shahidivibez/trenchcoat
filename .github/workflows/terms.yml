name: Accept Delphi Terms

# One-time, consent-gated terms acceptance for pure Path B (no local CLI/board).
# Run this ONCE before your first dry-run/live scout: the scout reads the real
# entry-state, which returns terms_not_accepted until the account accepts.
#
# Actions -> "Accept Delphi Terms" -> Run workflow -> check the confirm box.
# Reading the terms is NOT accepting them; the checkbox + Run is your explicit yes.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "I have read the terms URL printed in the 'Show terms' step and accept them for this account"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # MUST be live: terms acceptance is a real account action. Without this the
      # 'show terms' step would read the MOCK client and prove nothing.
      DELPHI_MODE: live
      DELPHI_API_ACCESS_KEY: ${{ secrets.DELPHI_API_ACCESS_KEY }}
      DELPHI_AGENT_ID: Trenchcoat
      DELPHI_AGENT_HARNESS: github-actions
      DELPHI_AGENT_MODEL: ${{ vars.DELPHI_AGENT_MODEL || 'gemini-2.5-flash' }}
      TRENCHCOAT_DATA_DIR: ./data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Show current terms (read the URL before accepting)
        run: |
          set +e
          OUT=$(trenchcoat terms 2>&1); CODE=$?
          echo "$OUT"
          { echo '## Current terms (live API)'; echo '```'; echo "$OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $CODE -ne 0 ]; then
            echo "::error title=Terms read failed::$(echo "$OUT" | tr '\n' ' ' | sed 's/%/%25/g')"
            exit $CODE
          fi

      - name: Accept terms (only with explicit consent)
        if: ${{ inputs.confirm }}
        run: |
          set +e
          OUT=$(trenchcoat accept-terms --yes 2>&1); CODE=$?
          echo "$OUT"
          { echo '## Terms acceptance'; echo '```'; echo "$OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $CODE -ne 0 ]; then
            # Surface the real API error as an annotation (readable via the API,
            # unlike raw logs which some environments cannot download).
            echo "::error title=Terms acceptance failed::$(echo "$OUT" | tr '\n' ' ' | sed 's/%/%25/g')"
            exit $CODE
          fi

      - name: Refuse without consent
        if: ${{ !inputs.confirm }}
        run: |
          echo "::error::confirm was not checked — terms NOT accepted. Read the terms URL above, then re-run with the box checked."
          exit 1
